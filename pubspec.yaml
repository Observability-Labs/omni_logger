name: omni_logger
description: "Omni Logger is a production-ready logging package for Flutter with auto-configuration, file rotation, isolate support, and build mode optimization."
version: 2.0.0
homepage: 'https://github.com/Observability-Labs/omni_logger'
repository: https://github.com/Observability-Labs/omni_logger

environment:
  sdk: ^3.8.1
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  logger: ^2.7.0
  path: ^1.9.1
  path_provider: ^2.1.5
  device_info_plus: ">=10.1.0 <14.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true